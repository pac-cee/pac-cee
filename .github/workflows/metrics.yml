name: Metrics
on:
  # Regenerate stats every day at 03:00 UTC
  schedule:
    - cron: "0 3 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Re-run when this workflow file changes
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pac-cee
          template: terminal
          filename: metrics.terminal.svg
          base: header, activity
          config_timezone: Africa/Kigali
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          # Restyle the Ubuntu terminal into a macOS one (GitHub-dark body, traffic lights on the left)
          extras_css: |
            pre { background: #161b22 !important; }
            .header { flex-direction: row-reverse; background: #21262d !important; }
            .buttons { flex-direction: row-reverse; }
            .button { color: transparent !important; text-shadow: none !important; margin: 0 6px 0 0 !important; }
            .buttons .button:nth-child(1) { background: #28c840 !important; }
            .buttons .button:nth-child(2) { background: #febc2e !important; }
            .button.exit { background: #ff5f57 !important; }

      - name: Generate streak card
        run: node scripts/streak.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add streak.terminal.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update streak card"
            git push origin main
          fi
